[project]
name = "paytrace"
version = "0.1.0"
description = "Diagnóstico por reglas de transferencias simuladas que fallaron o quedaron pendientes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
